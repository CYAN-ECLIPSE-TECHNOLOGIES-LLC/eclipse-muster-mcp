[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eclipse-muster"
version = "0.1.0"
description = "Eclipse Muster MCP — the Customer Graph core of the Eclipse customer adapter family: canonical Person/Company/Deal/Ticket/Conversation/Activity records with per-field provenance and Data Rights Ledgers, propose-only identity merges, field-level egress masking, records-only reply drafts, and a hash-chained, content-free receipt ledger. No platform is contacted and no credential exists in this build."
readme = "PYPI_README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Cyan Eclipse Technologies LLC" },
]
keywords = ["mcp", "model-context-protocol", "crm", "customer-graph", "identity-resolution"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://cetech.ai"
Repository = "https://github.com/CYAN-ECLIPSE-TECHNOLOGIES-LLC/eclipse-muster-mcp"
Vendor = "https://cetech.ai"

[project.scripts]
eclipse-muster = "server:main"

# Version lockstep: this version, the VERSION file, server.json, and the
# server.py docstring all read 0.1.0 — bump them together.
# Flat layout: the runtime is the top-level server.py module. Runtime
# data read beside server.py (Path(__file__).parent / ...) is
# force-included at the same relative path in the wheel — policy.json
# is runtime data and ships beside server.py.
[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
"bazaar-manifest.json" = "bazaar-manifest.json"
"policy.json" = "policy.json"
"fixtures/records.json" = "fixtures/records.json"

[tool.hatch.build.targets.sdist.force-include]
"server.py" = "server.py"
"bazaar-manifest.json" = "bazaar-manifest.json"
"policy.json" = "policy.json"
"fixtures/records.json" = "fixtures/records.json"
